<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SUNFORGE — Bend the dawn. Burn the night.</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141433; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The game is a fixed 1280x800 stage, scaled to the largest size the window allows. */
  #game { width: min(100vw, 160vh); aspect-ratio: 8 / 5; display: block; touch-action: none; }
  /* Read aloud, never shown: the game's description and its live status line. */
  #status, #about { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-labelledby="about"></canvas>
<p id="about">SUNFORGE: a sunbeam tower defense — bend the sun's beam with mirrors, prisms and lenses to burn the Murk before it eats the Dawn Crystal.</p>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
